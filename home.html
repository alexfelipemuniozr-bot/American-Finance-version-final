<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0", user-scalable=yes>
  <title>Mi cuenta | American Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(18, 18, 18, 0.94);
      --gold: #ffd700;
      --gold-dark: #b98618;
      --cyan: #00d9ff;
      --text: #f7f7f7;
      --muted: #b9b9b9;
      --line: rgba(255, 215, 0, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Inter", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 215, 0, 0.14), transparent 28%),
        radial-gradient(circle at bottom right, rgba(0, 217, 255, 0.11), transparent 30%),
        var(--bg);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px clamp(18px, 5vw, 64px);
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.74);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      text-decoration: none;
      color: var(--text);
    }

    .logo img {
      width: 46px;
      height: 46px;
      object-fit: contain;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 42px auto;
      display: grid;
      gap: 22px;
    }

    .hero,
    .actions {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
    }

    .hero {
      padding: clamp(28px, 5vw, 56px);
      display: grid;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1;
      letter-spacing: 0;
    }

    h1 span { color: var(--gold); }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      overflow: hidden;
    }

    .action {
      min-height: 130px;
      padding: 22px;
      display: grid;
      align-content: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.035);
    }

    .action:last-child { border-right: 0; }

    .action strong {
      color: var(--gold);
      font-size: 18px;
    }

    button,
    .button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      padding: 0 18px;
      color: #070707;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
      display: inline-grid;
      place-items: center;
    }

    @media (max-width: 820px) {
      .actions { grid-template-columns: 1fr 1fr; }
      .action:nth-child(2) { border-right: 0; }
    }

    @media (max-width: 560px) {
      header { align-items: flex-start; flex-direction: column; }
      .actions { grid-template-columns: 1fr; }
      .action { border-right: 0; border-bottom: 1px solid var(--line); }
      .action:last-child { border-bottom: 0; }
    }
  
    @media (max-width: 768px) {
      body { font-size: clamp(14px, 3.5vw, 16px); padding: clamp(12px, 3vw, 16px); }
      
      /* Navbar/Header responsive */
      header, .navbar { flex-direction: column; gap: clamp(12px, 3vw, 16px); padding: clamp(12px, 3vw, 16px) !important; }
      
      /* Main layout */
      main { width: 100% !important; padding: clamp(12px, 3vw, 20px) !important; margin: auto; }
      
      /* Container & sections */
      .container, .layout, .panel, .form-panel, section { grid-template-columns: 1fr !important; padding: clamp(16px, 3vw, 28px) !important; gap: clamp(12px, 3vw, 20px) !important; }
      
      /* Grid items */
      .grid, .info-grid, .actions, .courses, .cards { grid-template-columns: 1fr !important; }
      
      /* Typography */
      h1 { font-size: clamp(24px, 6vw, 32px) !important; margin-bottom: clamp(12px, 3vw, 16px); }
      h2 { font-size: clamp(20px, 5vw, 28px) !important; margin-bottom: clamp(10px, 2.5vw, 14px); }
      h3 { font-size: clamp(16px, 4vw, 24px) !important; margin-bottom: clamp(8px, 2vw, 12px); }
      p { font-size: clamp(13px, 3vw, 15px); line-height: 1.5; }
      
      /* Forms & Inputs */
      input, textarea, select, button, .button { min-height: 44px !important; padding: clamp(10px, 2vw, 14px) !important; font-size: clamp(14px, 3vw, 16px); width: 100% !important; }
      
      /* Flex wrapping */
      .flex, [display="flex"] { flex-direction: column !important; flex-wrap: wrap; }
      
      /* Cards & boxes */
      .card, .box, .question, .option, .info-box { padding: clamp(12px, 3vw, 20px) !important; margin-bottom: clamp(12px, 3vw, 16px); }
      
      /* Images */
      img { max-width: 100%; height: auto; }
      
      /* Buttons */
      .finish-btn, .back-btn, .btn, [type="submit"], [type="button"] { min-height: 44px; padding: clamp(10px, 2vw, 14px) !important; }
      
      /* Logo sizing */
      .logo img, .brand img { max-width: 80%; width: clamp(120px, 40vw, 180px); }
      
      /* Text alignment */
      .hero, .brand { text-align: center; align-items: center; justify-items: center; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">
      <img src="logo american finance-Photoroom.png" alt="American Finance">
      <span>American Finance</span>
    </a>
    <button type="button" id="logoutButton">Cerrar sesión</button>
  </header>

  <main>
    <section class="hero">
      <p>Mi cuenta</p>
      <h1>Hola, <span id="userName">usuario</span></h1>
      <p id="userEmail"></p>
      <p>Tu sesión está activa. Desde aquí puedes entrar a los cursos, herramientas y comunidad.</p>
    </section>

    <section class="actions" aria-label="Accesos rápidos">
      <a class="action" href="cursos.html">
        <strong>Cursos</strong>
        <span>Continúa con las unidades educativas.</span>
      </a>
      <a class="action" href="calculadora.html">
        <strong>Calculadora</strong>
        <span>Usa herramientas financieras.</span>
      </a>
      <a class="action" href="IA.html">
        <strong>Asistente IA</strong>
        <span>Haz preguntas de finanzas.</span>
      </a>
      <a class="action" href="comunidad.html">
        <strong>Comunidad</strong>
        <span>Participa y comparte avances.</span>
      </a>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    AmericanFinanceAuth.requireAuth().then((user) => {
      if (!user) return;
      document.getElementById("userName").textContent = user.name;
      document.getElementById("userEmail").textContent = user.email;
    });

    document.getElementById("logoutButton").addEventListener("click", () => {
      AmericanFinanceAuth.clearSession();
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
